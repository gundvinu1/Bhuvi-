version: '3.8'

# ============================================================
# BHUVI Local Infrastructure Stack
# Module 03: PostgreSQL 16 & Redis 7
# ============================================================

services:
  # ------------------------------------------------------------
  # PostgreSQL 16 – Primary Persistent Database
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: bhuvi-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bhuvi}
      POSTGRES_USER: ${POSTGRES_USER:-bhuvi}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bhuvi_dev_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bhuvi} -d ${POSTGRES_DB:-bhuvi}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - bhuvi-network

  # ------------------------------------------------------------
  # Redis 7 – Cache & BullMQ Queue Broker
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: bhuvi-redis
    restart: unless-stopped
    command: >
      redis-server
      --appendonly yes
      --save 60 1
      --loglevel notice
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - bhuvi-network

# ------------------------------------------------------------
# Persistent Named Volumes
# ------------------------------------------------------------
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

# ------------------------------------------------------------
# Isolated Bridge Network
# ------------------------------------------------------------
networks:
  bhuvi-network:
    driver: bridge
